<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/apple-touch-icon.png" />
    <title>AI 小说创作工作台 | AI Novel Production Engine</title>
    <!-- AI-NOVEL-APP local-first mobile runtime: start -->
    <script>
      (() => {
        if ("%VITE_MOBILE_BUILD%" !== "true") return;
        window.__AI_NOVEL_RUNTIME__ = {
          ...(window.__AI_NOVEL_RUNTIME__ || {}),
          mode: "web",
          localFirst: true,
          apiBaseUrl: "local://api",
          isPackaged: true,
          updateChannel: "mobile"
        };
        const reportFatal = (reason) => {
          window.setTimeout(() => {
            const root = document.getElementById("root");
            if (!root || root.textContent?.trim()) return;
            root.replaceChildren();
            const box = document.createElement("div");
            box.style.cssText = "min-height:100vh;padding:32px;background:#090b16;color:#f3f4f6;font-family:sans-serif";
            const title = document.createElement("h1");
            title.textContent = "AI Novel 启动失败";
            const detail = document.createElement("pre");
            detail.style.cssText = "white-space:pre-wrap;word-break:break-word;margin-top:16px;padding:12px;background:#020617;border-radius:10px;font-size:12px";
            detail.textContent = reason instanceof Error ? (reason.stack || reason.message) : String(reason || "Unknown startup error");
            box.append(title, detail);
            root.append(box);
          }, 0);
        };
        window.addEventListener("error", (event) => reportFatal(event.error || event.message));
        window.addEventListener("unhandledrejection", (event) => reportFatal(event.reason));
      })();
    </script>
    <!-- AI-NOVEL-APP local-first mobile runtime: end -->
    <script>
      (() => {
        try {
          const preference = JSON.parse(localStorage.getItem("ai-novel.theme.preference") || "null") || {};
          const mode = preference.mode === "dark" || preference.mode === "light" || preference.mode === "system" ? preference.mode : "system";
          const resolvedMode = mode === "system" ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
          const palette = ["ink", "paper", "night"].includes(preference.palette) ? preference.palette : "ink";
          const density = ["comfortable", "compact"].includes(preference.density) ? preference.density : "comfortable";
          document.documentElement.classList.toggle("dark", resolvedMode === "dark");
          document.documentElement.dataset.theme = palette;
          document.documentElement.dataset.density = density;
          document.documentElement.style.colorScheme = resolvedMode;
        } catch {
          // 启动阶段使用默认浅色主题，React 挂载后会继续校正偏好。
        }
      })();
    </script>
    <style>
      :root {
        color: #0f172a;
        background: #ffffff;
        font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      }

      body {
        margin: 0;
        background: #ffffff;
      }

      html.dark body {
        color: #f8fafc;
        background: #0f172a;
      }

      .app-startup-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .app-startup-content {
        width: min(100%, 420px);
        text-align: center;
      }

      .app-startup-spinner {
        width: 48px;
        height: 48px;
        margin: 0 auto 20px;
        border-radius: 999px;
        border: 1px solid #e2e8f0;
        border-top-color: #0f172a;
        animation: app-startup-spin 0.9s linear infinite;
      }

      .app-startup-title {
        margin: 0;
        font-size: 20px;
        line-height: 1.35;
        font-weight: 650;
        letter-spacing: 0;
      }

      .app-startup-copy {
        margin: 12px 0 0;
        color: #64748b;
        font-size: 14px;
        line-height: 1.7;
      }

      @keyframes app-startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-startup-shell">
        <div class="app-startup-content">
          <div class="app-startup-spinner" aria-hidden="true"></div>
          <h1 class="app-startup-title">正在加载创作工作台</h1>
          <p class="app-startup-copy">系统会加载本地创作数据，并在需要 AI 时直接连接 DeepSeek。</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
