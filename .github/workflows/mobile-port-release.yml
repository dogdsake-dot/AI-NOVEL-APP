name: Mobile Android release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .mobile-port-ready

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.6.0'
          run_install: false

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android branding renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin

      - name: Sync upstream and apply mobile overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ai-novel-upstream
          git clone --depth 1 https://github.com/ExplosiveCoderflome/AI-Novel-Writing-Assistant.git /tmp/ai-novel-upstream
          UPSTREAM_SHA="$(git -C /tmp/ai-novel-upstream rev-parse HEAD)"
          printf '%s\n' "$UPSTREAM_SHA" > .porting/UPSTREAM_COMMIT

          rsync -a --delete \
            --exclude=.git \
            --exclude=.github \
            --exclude=.porting \
            --exclude=.mobile-port-ready \
            /tmp/ai-novel-upstream/ ./

          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/src/app.ts')
          text = p.read_text()
          if 'isCapacitorOrigin' not in text:
              old = '        const isLocalhostDevOrigin = /^http:\\/\\/(localhost|127\\.0\\.0\\.1):\\d+$/.test(origin);'
              new = '        const isLocalhostDevOrigin = /^https?:\\/\\/(localhost|127\\.0\\.0\\.1)(?::\\d+)?$/.test(origin);\n        const isCapacitorOrigin = /^(?:capacitor:\\/\\/|https?:\\/\\/)localhost(?::\\d+)?$/.test(origin);'
              if old not in text:
                  raise SystemExit('Upstream CORS rule changed; review mobile patch')
              text = text.replace(old, new, 1)
              old_cb = '        callback(null, isListedOrigin || isLocalhostDevOrigin || isLanOrigin);'
              new_cb = '        callback(null, isListedOrigin || isLocalhostDevOrigin || isLanOrigin || isCapacitorOrigin);'
              if old_cb not in text:
                  raise SystemExit('Upstream CORS callback changed; review mobile patch')
              text = text.replace(old_cb, new_cb, 1)
              p.write_text(text)
          PY

          node .porting/apply-mobile-port.mjs
          printf 'UPSTREAM_SHA=%s\n' "$UPSTREAM_SHA" >> "$GITHUB_ENV"
          printf 'MOBILE_VERSION=%s\n' "$(cat MOBILE_VERSION)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build original React client
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @ai-novel/shared build
          AI_NOVEL_CLIENT_BASE=relative VITE_MOBILE_BUILD=true pnpm --filter @ai-novel/client build

      - name: Generate branded Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d mobile/android ]; then
            pnpm --dir mobile exec cap add android
          fi
          pnpm --dir mobile exec cap sync android
          python3 .porting/apply-android-release.py

          while IFS=: read -r density size; do
            out="mobile/android/app/src/main/res/mipmap-$density"
            mkdir -p "$out"
            rsvg-convert -w "$size" -h "$size" .porting/branding/app-icon.svg -o "$out/ic_launcher.png"
            cp "$out/ic_launcher.png" "$out/ic_launcher_round.png"
          done <<'EOF'
          mdpi:48
          hdpi:72
          xhdpi:96
          xxhdpi:144
          xxxhdpi:192
          EOF

      - name: Commit synchronized source and Android branding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream $UPSTREAM_SHA and prepare Android $MOBILE_VERSION"
            git push origin HEAD:main
          fi

      - name: Validate release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              echo "See ANDROID_RELEASE.md and scripts/configure-android-signing.ps1" >&2
              exit 2
            fi
          done
          KEYSTORE_FILE="$RUNNER_TEMP/ai-novel-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          printf 'AI_NOVEL_RELEASE_STORE_FILE=%s\n' "$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        shell: bash
        env:
          AI_NOVEL_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AI_NOVEL_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AI_NOVEL_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd mobile/android
          chmod +x gradlew
          ./gradlew clean assembleRelease bundleRelease --stacktrace
          cd ../..

          mkdir -p dist
          APK="dist/AI-NOVEL-APP-v$MOBILE_VERSION-release.apk"
          AAB="dist/AI-NOVEL-APP-v$MOBILE_VERSION-release.aab"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$APK"
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab "$AAB"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo 'apksigner not found' >&2
            exit 3
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist/APK_SIGNATURE.txt

          EXPECTED_CERT='58:6D:14:84:E0:C5:87:67:28:8F:B8:BD:BE:85:9E:C6:BF:F6:C6:B8:C0:22:64:F2:1A:3C:AA:A3:C5:42:06:E4'
          ACTUAL_CERT="$(keytool -list -v -keystore "$AI_NOVEL_RELEASE_STORE_FILE" -storepass "$AI_NOVEL_RELEASE_STORE_PASSWORD" -alias "$AI_NOVEL_RELEASE_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "Unexpected Android release certificate fingerprint: $ACTUAL_CERT" >&2
            exit 4
          fi

          sha256sum "$APK" "$AAB" > "dist/AI-NOVEL-APP-v$MOBILE_VERSION.sha256"

      - name: Publish stable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$MOBILE_VERSION"
          cat > /tmp/release-notes.md <<EOF
          # AI-NOVEL-APP $TAG

          First long-term signed Android release of AI-NOVEL-APP.

          - Package ID remains \`com.dogdsake.ainovelapp\`.
          - Persistent release certificate starts with v0.2.0 and will be reused for future Android releases.
          - Includes branded launcher/adaptive icons and branded splash screen.
          - Includes signed APK and signed AAB, SHA-256 checksums, and APK certificate report.
          - Synchronized from \`ExplosiveCoderflome/AI-Novel-Writing-Assistant\` at upstream commit \`$UPSTREAM_SHA\`.
          - Original React/Express/Prisma/LangGraph/RAG functionality remains retained; Electron-only Windows shell features are excluded.
          - License: AGPL-3.0-only.

          ## Upgrade note

          v0.1.0 was debug-signed. Android does not allow an APK signed with the new v0.2.0 release certificate to overwrite that debug-signed installation. If v0.1.0 is installed, uninstall it once before installing v0.2.0. From v0.2.0 onward, normal in-place upgrades work as long as the same release signing key is preserved.
          EOF

          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "dist/AI-NOVEL-APP-v$MOBILE_VERSION-release.apk" \
            "dist/AI-NOVEL-APP-v$MOBILE_VERSION-release.aab" \
            "dist/AI-NOVEL-APP-v$MOBILE_VERSION.sha256" \
            "dist/APK_SIGNATURE.txt" \
            --title "AI-NOVEL-APP $TAG" \
            --notes-file /tmp/release-notes.md \
            --latest
