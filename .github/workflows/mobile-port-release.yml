name: Mobile Android release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .mobile-port-ready

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.6.0'
          run_install: false

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync upstream and apply mobile overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ai-novel-upstream
          git clone --depth 1 https://github.com/ExplosiveCoderflome/AI-Novel-Writing-Assistant.git /tmp/ai-novel-upstream
          UPSTREAM_SHA="$(git -C /tmp/ai-novel-upstream rev-parse HEAD)"
          printf '%s\n' "$UPSTREAM_SHA" > .porting/UPSTREAM_COMMIT

          rsync -a --delete \
            --exclude=.git \
            --exclude=.github \
            --exclude=.porting \
            --exclude=.mobile-port-ready \
            /tmp/ai-novel-upstream/ ./

          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/src/app.ts')
          text = p.read_text()
          if 'isCapacitorOrigin' not in text:
              old = '        const isLocalhostDevOrigin = /^http:\\/\\/(localhost|127\\.0\\.0\\.1):\\d+$/.test(origin);'
              new = '        const isLocalhostDevOrigin = /^https?:\\/\\/(localhost|127\\.0\\.0\\.1)(?::\\d+)?$/.test(origin);\n        const isCapacitorOrigin = /^(?:capacitor:\\/\\/|https?:\\/\\/)localhost(?::\\d+)?$/.test(origin);'
              if old not in text:
                  raise SystemExit('Upstream CORS rule changed; review mobile patch')
              text = text.replace(old, new, 1)
              old_cb = '        callback(null, isListedOrigin || isLocalhostDevOrigin || isLanOrigin);'
              new_cb = '        callback(null, isListedOrigin || isLocalhostDevOrigin || isLanOrigin || isCapacitorOrigin);'
              if old_cb not in text:
                  raise SystemExit('Upstream CORS callback changed; review mobile patch')
              text = text.replace(old_cb, new_cb, 1)
              p.write_text(text)
          PY

          node .porting/apply-mobile-port.mjs
          printf 'UPSTREAM_SHA=%s\n' "$UPSTREAM_SHA" >> "$GITHUB_ENV"
          printf 'MOBILE_VERSION=%s\n' "$(cat MOBILE_VERSION)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build original React client
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @ai-novel/shared build
          AI_NOVEL_CLIENT_BASE=relative VITE_MOBILE_BUILD=true pnpm --filter @ai-novel/client build

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d mobile/android ]; then
            pnpm --dir mobile exec cap add android
          fi
          pnpm --dir mobile exec cap sync android
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('mobile/android/app/build.gradle')
          text = p.read_text()
          text = re.sub(r'versionCode\s+\d+', 'versionCode 1', text)
          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "' + os.environ['MOBILE_VERSION'] + '"', text)
          p.write_text(text)
          PY

      - name: Commit synchronized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream $UPSTREAM_SHA and Android port $MOBILE_VERSION"
            git push origin HEAD:main
          fi

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ../..
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "dist/AI-NOVEL-APP-$MOBILE_VERSION.apk"
          sha256sum "dist/AI-NOVEL-APP-$MOBILE_VERSION.apk" > "dist/AI-NOVEL-APP-$MOBILE_VERSION.apk.sha256"

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$MOBILE_VERSION"
          LEGACY_TAG="v0.4.19-mobile.1"
          if [ "$TAG" = "v0.1.0" ]; then
            gh release delete "$LEGACY_TAG" --yes --cleanup-tag 2>/dev/null || true
            git push origin ":refs/tags/$LEGACY_TAG" 2>/dev/null || true
          fi
          NOTES="AI-NOVEL-APP initial Android port release. Mobile app version: $MOBILE_VERSION. Synchronized from ExplosiveCoderflome/AI-Novel-Writing-Assistant upstream commit: $UPSTREAM_SHA. Core React/Express/Prisma/LangGraph/RAG functionality is retained; Electron-only Windows shell features are excluded. The APK connects to the original server over LAN/HTTPS. License: AGPL-3.0-only. This is a debug-signed installable test prerelease."
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "dist/AI-NOVEL-APP-$MOBILE_VERSION.apk" \
            "dist/AI-NOVEL-APP-$MOBILE_VERSION.apk.sha256" \
            --title "AI-NOVEL-APP $TAG" \
            --notes "$NOTES" \
            --prerelease
