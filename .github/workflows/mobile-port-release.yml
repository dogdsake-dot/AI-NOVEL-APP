name: Mobile Android release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .mobile-port-ready

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.6.0'
          run_install: false

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android branding renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin

      - name: Sync upstream and apply mobile overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ai-novel-upstream
          git clone --depth 1 https://github.com/ExplosiveCoderflome/AI-Novel-Writing-Assistant.git /tmp/ai-novel-upstream
          UPSTREAM_SHA="$(git -C /tmp/ai-novel-upstream rev-parse HEAD)"
          printf '%s\n' "$UPSTREAM_SHA" > .porting/UPSTREAM_COMMIT

          rsync -a --delete \
            --exclude=.git \
            --exclude=.github \
            --exclude=.porting \
            --exclude=.mobile-port-ready \
            --exclude=ANDROID_RELEASE.md \
            /tmp/ai-novel-upstream/ ./

          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/src/app.ts')
          text = p.read_text()
          if 'isCapacitorOrigin' not in text:
              old = '        const isLocalhostDevOrigin = /^http:\\/\\/(localhost|127\\.0\\.0\\.1):\\d+$/.test(origin);'
              new = '        const isLocalhostDevOrigin = /^https?:\\/\\/(localhost|127\\.0\\.0\\.1)(?::\\d+)?$/.test(origin);\n        const isCapacitorOrigin = /^(?:capacitor:\\/\\/|https?:\\/\\/)localhost(?::\\d+)?$/.test(origin);'
              if old not in text:
                  raise SystemExit('Upstream CORS rule changed; review mobile patch')
              text = text.replace(old, new, 1)
              old_cb = '        callback(null, isListedOrigin || isLocalhostDevOrigin || isLanOrigin);'
              new_cb = '        callback(null, isListedOrigin || isLocalhostDevOrigin || isLanOrigin || isCapacitorOrigin);'
              if old_cb not in text:
                  raise SystemExit('Upstream CORS callback changed; review mobile patch')
              text = text.replace(old_cb, new_cb, 1)
              p.write_text(text)
          PY

          node .porting/apply-mobile-port.mjs
          printf 'UPSTREAM_SHA=%s\n' "$UPSTREAM_SHA" >> "$GITHUB_ENV"
          printf 'MOBILE_VERSION=%s\n' "$(cat MOBILE_VERSION)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build original React client
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @ai-novel/shared build
          AI_NOVEL_CLIENT_BASE=relative VITE_MOBILE_BUILD=true pnpm --filter @ai-novel/client build

      - name: Generate branded Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d mobile/android ]; then
            pnpm --dir mobile exec cap add android
          fi
          pnpm --dir mobile exec cap sync android
          python3 .porting/apply-android-release.py

          while IFS=: read -r density size; do
            out="mobile/android/app/src/main/res/mipmap-$density"
            mkdir -p "$out"
            rsvg-convert -w "$size" -h "$size" .porting/branding/app-icon.svg -o "$out/ic_launcher.png"
            cp "$out/ic_launcher.png" "$out/ic_launcher_round.png"
          done <<'EOF'
          mdpi:48
          hdpi:72
          xhdpi:96
          xxhdpi:144
          xxxhdpi:192
          EOF

      - name: Commit synchronized source and Android branding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream $UPSTREAM_SHA and prepare Android $MOBILE_VERSION"
            git push origin HEAD:main
          fi

      # Simplified sideload signing line, matching the operational model used by
      # Abyss Journal: one pinned development certificate is reused forever.
      # Unlike Abyss Journal's private-repo keystore, this public repository does
      # not store a private key. Instead CI reconstructs the well-known AOSP test
      # key from an immutable upstream commit. This is intentionally NOT a secure
      # production identity; anyone can obtain the same AOSP test private key.
      - name: Prepare pinned development signing identity
        shell: bash
        run: |
          set -euo pipefail
          AOSP_BUILD_COMMIT='045a3d6a3e359633a14853a5a5e1e4f2a11cbdae'
          BASE_URL="https://raw.githubusercontent.com/aosp-mirror/platform_build/$AOSP_BUILD_COMMIT/target/product/security"
          PK8="$RUNNER_TEMP/ai-novel-testkey.pk8"
          CERT="$RUNNER_TEMP/ai-novel-testkey.x509.pem"
          PEM="$RUNNER_TEMP/ai-novel-testkey.pem"
          P12="$RUNNER_TEMP/ai-novel-testkey.p12"
          KEYSTORE_FILE="$RUNNER_TEMP/ai-novel-development.jks"

          curl -fsSL --retry 3 "$BASE_URL/testkey.pk8" -o "$PK8"
          curl -fsSL --retry 3 "$BASE_URL/testkey.x509.pem" -o "$CERT"

          EXPECTED_CERT='A4:0D:A8:0A:59:D1:70:CA:A9:50:CF:15:C1:8C:45:4D:47:A3:9B:26:98:9D:8B:64:0E:CD:74:5B:A7:1B:F5:DC'
          ACTUAL_CERT="$(openssl x509 -in "$CERT" -noout -fingerprint -sha256 | sed 's/^.*=//')"
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "Pinned AOSP development certificate validation failed: $ACTUAL_CERT" >&2
            exit 2
          fi

          openssl pkcs8 -inform DER -nocrypt -in "$PK8" -out "$PEM"
          openssl pkcs12 -export \
            -in "$CERT" \
            -inkey "$PEM" \
            -out "$P12" \
            -name androiddebugkey \
            -passout pass:android

          keytool -importkeystore -noprompt \
            -srckeystore "$P12" \
            -srcstoretype PKCS12 \
            -srcstorepass android \
            -srcalias androiddebugkey \
            -destkeystore "$KEYSTORE_FILE" \
            -deststoretype JKS \
            -deststorepass android \
            -destkeypass android \
            -destalias androiddebugkey

          KEYSTORE_CERT="$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1)"
          if [ "$KEYSTORE_CERT" != "$EXPECTED_CERT" ]; then
            echo "Reconstructed keystore certificate mismatch: $KEYSTORE_CERT" >&2
            exit 3
          fi

          printf 'AI_NOVEL_RELEASE_STORE_FILE=%s\n' "$KEYSTORE_FILE" >> "$GITHUB_ENV"
          printf 'AI_NOVEL_EXPECTED_CERT=%s\n' "$EXPECTED_CERT" >> "$GITHUB_ENV"

      - name: Build fixed-signature release APK and AAB
        shell: bash
        env:
          AI_NOVEL_RELEASE_STORE_PASSWORD: android
          AI_NOVEL_RELEASE_KEY_ALIAS: androiddebugkey
          AI_NOVEL_RELEASE_KEY_PASSWORD: android
        run: |
          set -euo pipefail
          cd mobile/android
          chmod +x gradlew
          ./gradlew clean assembleRelease bundleRelease --stacktrace
          cd ../..

          mkdir -p dist
          APK="dist/AI-NOVEL-APP-v$MOBILE_VERSION-release.apk"
          AAB="dist/AI-NOVEL-APP-v$MOBILE_VERSION-release.aab"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$APK"
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab "$AAB"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo 'apksigner not found' >&2
            exit 4
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist/APK_SIGNATURE.txt

          APK_CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^.*Signer.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED_COMPACT="$(printf '%s' "$AI_NOVEL_EXPECTED_CERT" | tr -d ':')"
          APK_COMPACT="$(printf '%s' "$APK_CERT" | tr -d ':[:space:]')"
          if [ "$APK_COMPACT" != "$EXPECTED_COMPACT" ]; then
            echo "Built APK certificate does not match the pinned development identity: $APK_CERT" >&2
            exit 5
          fi

          sha256sum "$APK" "$AAB" > "dist/AI-NOVEL-APP-v$MOBILE_VERSION.sha256"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$MOBILE_VERSION"
          cat > /tmp/release-notes.md <<EOF
          # AI-NOVEL-APP $TAG

          Android v0.2.0 starts the simplified fixed-signature sideload release line.

          - Package ID remains \`com.dogdsake.ainovelapp\`.
          - Uses one pinned, reproducible AOSP development/test certificate for this and future simplified builds.
          - No GitHub Repository Secrets are required.
          - Includes branded launcher/adaptive icons and branded splash screen.
          - Includes signed APK and signed AAB, SHA-256 checksums, and APK certificate report.
          - Synchronized from \`ExplosiveCoderflome/AI-Novel-Writing-Assistant\` at upstream commit \`$UPSTREAM_SHA\`.
          - Original React/Express/Prisma/LangGraph/RAG functionality remains retained; Electron-only Windows shell features are excluded.
          - License: AGPL-3.0-only.

          ## Signing / upgrade note

          v0.1.0 used a different debug certificate, so uninstall v0.1.0 once before installing v0.2.0. From v0.2.0 onward, builds produced by this workflow keep the same certificate and can update in place.

          This simplified certificate is a public AOSP test identity, not a private production identity. Anyone can obtain the same test key and produce an APK with the same signing certificate. It is suitable for personal sideload/development convenience, not for a security-sensitive public production distribution.
          EOF

          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "dist/AI-NOVEL-APP-v$MOBILE_VERSION-release.apk" \
            "dist/AI-NOVEL-APP-v$MOBILE_VERSION-release.aab" \
            "dist/AI-NOVEL-APP-v$MOBILE_VERSION.sha256" \
            "dist/APK_SIGNATURE.txt" \
            --title "AI-NOVEL-APP $TAG" \
            --notes-file /tmp/release-notes.md \
            --latest
